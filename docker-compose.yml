version: '3.8'

services:
  adaptive-tutor:
    build: .
    container_name: adaptive-llm-tutor
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - CHROMA_COLLECTION_NAME=dl-tutor-chroma
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./learner_memory.db:/app/learner_memory.db
    restart: unless-stopped
